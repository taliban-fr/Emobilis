<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentor - Home</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;500&family=Raleway:wght@600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --brand: #5fd16a;
      --brand-dark: #4cc058;
      --text: #1a1a1a;
    }
    body { font-family: "Open Sans", sans-serif; color: var(--text); }

    /* ---------- Header ---------- */
    #header {
      height: 77px;
      background: #fff;
      box-shadow: 0 2px 15px rgba(0, 0, 0, .08);
    }
    #header .navbar { height: 100%; padding: 0; }
    .logo {
      font-family: "Poppins", sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--brand);
      text-decoration: none;
    }
    .logo:hover { 
        color: var(--brand-dark);
     }

    .navbar-nav .nav-link {
      font-family: "Poppins", sans-serif;
      font-size: 15px;
      color: var(--text);
      padding: 10px 13px;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active { color: var(--brand); }
    .dropdown-menu { border: 0; box-shadow: 0 0 30px rgba(0, 0, 0, .1); }
    .dropdown-item:hover { color: var(--brand); background: transparent; }

    .btn-get-started {
      background: var(--brand);
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 14px;
      padding: 8px 25px;
      border-radius: 50px;
      margin-left: 15px;
      transition: .3s;
    }
    .btn-get-started:hover { background: var(--brand-dark); color: #fff; }

    /* ---------- Hero ---------- */
    #hero {
      min-height: calc(100vh - 77px);
      background:
        linear-gradient(rgba(0, 0, 0, .55), rgba(0, 0, 0, .55)),
        url("https://images.unsplash.com/photo-1562346531-6fd51e998566?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D") center center / cover no-repeat,
        linear-gradient(135deg, #8a5a2b, #4a2e14);
      display: flex;
      align-items: center;
      color: #fff;
    }
    #hero h1 {
      font-family: "Raleway", sans-serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 1.05;
      margin: 0 0 10px;
    }
    #hero h2 {
      font-size: 24px;
      font-weight: 400;
      color: rgba(255, 255, 255, .8);
      margin-bottom: 30px;
    }
    .btn-hero {
      font-family: "Poppins", sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 50px;
      padding: 10px 32px;
      transition: .3s;
    }
    .btn-hero:hover { background: var(--brand); border-color: var(--brand); color: #fff; }

    @media (max-width: 991px) {
      .btn-get-started { margin: 10px 0 15px; display: inline-block; }
      #header { height: auto; min-height: 77px; }
    }
    @media (max-width: 768px) {
      #hero h1 { font-size: 32px; }
      #hero h2 { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!--Header-->
  <header id="header" class="fixed-top">
    <div class="container">
      <nav class="navbar navbar-expand-lg">
        <a href="#" class="logo me-auto">Mentor</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMenu" aria-controls="navMenu"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end bg-white" id="navMenu">
          <ul class="navbar-nav align-items-lg-center">
            <li class="nav-item"><a class="nav-link active" href="#hero">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#courses">Courses</a></li>
            <li class="nav-item"><a class="nav-link" href="#trainers">Trainers</a></li>
            <li class="nav-item"><a class="nav-link" href="#events">Events</a></li>
            <li class="nav-item"><a class="nav-link" href="#pricing">Pricing</a></li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Dropdown</a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Dropdown 1</a></li>
                <li><a class="dropdown-item" href="#">Dropdown 2</a></li>
                <li><a class="dropdown-item" href="#">Dropdown 3</a></li>
              </ul>
            </li>
            <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
            <li class="nav-item"><a class="btn btn-get-started" href="#about">Get Started</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <!--Hero-->
  <section id="hero" style="margin-top:77px;">
    <div class="container">
      <h1>Learning Today,<br>Leading Tomorrow</h1>
      <h2>We are team of talented designers making websites with Bootstrap</h2>
      <a href="#about" class="btn btn-hero">Get Started</a>
    </div>
  </section>

  <!-- Bootstrap 5 JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
